<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Edoardo's Girlfriend Application™</title>
<meta name="description" content="1 position open. Applications reviewed by a highly biased committee.">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--pink:#ff2e7e;--ink:#111;--cream:#fff8ef;--lime:#c6ff3d;--purple:#7b2cff;--red:#ff3b30}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Bricolage Grotesque',system-ui,sans-serif;background:var(--ink);color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px;overflow-x:hidden}
body:before{content:"";position:fixed;inset:0;background:radial-gradient(circle at 20% 10%,#ff2e7e55,transparent 40%),radial-gradient(circle at 90% 90%,#7b2cff66,transparent 45%);pointer-events:none}
.card{position:relative;background:var(--cream);border-radius:28px;width:100%;max-width:460px;min-height:600px;padding:26px 22px 22px;box-shadow:0 0 0 3px var(--ink),10px 10px 0 var(--pink);overflow:hidden}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;font-size:11px;font-weight:800;letter-spacing:1px;text-transform:uppercase}
.logo{background:var(--ink);color:var(--cream);padding:5px 10px;border-radius:99px}
.hearts{font-size:14px;letter-spacing:2px}
.bar{height:10px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-bottom:22px;background:#fff}
.bar i{display:block;height:100%;width:0;background:repeating-linear-gradient(45deg,var(--pink) 0 10px,#ff6fa6 10px 20px);transition:width .5s}
.tag{display:inline-block;border:2px solid var(--ink);border-radius:99px;padding:4px 11px;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;background:var(--lime)}
.tag.spicy{background:var(--red);color:#fff}.tag.game{background:var(--purple);color:#fff}
h1{font-size:36px;line-height:1;font-weight:800;letter-spacing:-1.5px;margin-bottom:10px}
h2{font-size:22px;line-height:1.2;font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
.hint{font-size:13px;color:#777;margin-bottom:16px}
.scribble{font-family:Caveat,cursive;color:var(--pink);font-size:24px;transform:rotate(-3deg);display:inline-block}
.opt{display:block;width:100%;text-align:left;border:2px solid var(--ink);background:#fff;border-radius:16px;padding:13px 15px;margin-bottom:10px;font:600 14.5px/1.35 inherit;font-family:inherit;cursor:pointer;box-shadow:3px 3px 0 var(--ink);transition:transform .1s,box-shadow .1s}
.opt:active{transform:translate(3px,3px);box-shadow:0 0 0 var(--ink)}
.opt.pick{background:var(--pink);color:#fff}
.big{display:block;width:100%;border:3px solid var(--ink);background:var(--pink);color:#fff;border-radius:18px;padding:16px;font:800 17px inherit;font-family:inherit;cursor:pointer;box-shadow:5px 5px 0 var(--ink);margin-top:14px}
.big:active{transform:translate(4px,4px);box-shadow:1px 1px 0 var(--ink)}
.big:disabled{opacity:.4}
.big.alt{background:#fff;color:var(--ink)}
input.name{width:100%;border:3px solid var(--ink);border-radius:16px;padding:16px;font:700 20px inherit;font-family:inherit;background:#fff;outline:none}
.fine{font-size:10.5px;color:#999;margin-top:14px;line-height:1.4}
/* HR toast */
.toast{position:absolute;left:18px;right:18px;bottom:18px;background:var(--ink);color:var(--cream);border-radius:16px;padding:14px 16px;font-size:14px;line-height:1.4;transform:translateY(160%);transition:transform .35s cubic-bezier(.3,1.5,.6,1);z-index:30}
.toast.show{transform:translateY(0)}
.toast b{color:var(--lime);display:block;font-size:11px;letter-spacing:1px;margin-bottom:3px}
/* Flag game */
.arena{position:relative;height:340px;border:3px solid var(--ink);border-radius:20px;background:#fff;overflow:hidden;touch-action:manipulation}
.hud{display:flex;justify-content:space-between;font-weight:800;margin-bottom:8px;font-size:15px}
.fall{position:absolute;padding:7px 11px;border-radius:99px;border:2px solid var(--ink);font-size:12.5px;font-weight:800;white-space:nowrap;cursor:pointer;user-select:none}
.fall.r{background:#ffe1e1}.fall.g{background:#e6ffd1}
.pop{position:absolute;font-weight:800;font-size:18px;pointer-events:none;animation:up .7s forwards}
@keyframes up{to{transform:translateY(-40px);opacity:0}}
/* Swipe */
.swipe{position:relative;height:260px;margin:6px 0 14px}
.sc{position:absolute;inset:0;border:3px solid var(--ink);border-radius:22px;background:#fff;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:24px;box-shadow:6px 6px 0 var(--ink);transition:transform .4s,opacity .4s}
.sc .e{font-size:56px;margin-bottom:12px}.sc p{font-size:18px;font-weight:800;line-height:1.25}
.sc.outL{transform:translateX(-140%) rotate(-25deg);opacity:0}.sc.outR{transform:translateX(140%) rotate(25deg);opacity:0}
.row{display:flex;gap:12px}.row .big{margin-top:0}
/* Phone */
.phone{background:#000;border-radius:26px;padding:16px 12px;min-height:250px;display:flex;flex-direction:column;gap:8px;margin-bottom:12px}
.ph-head{color:#aaa;font-size:11px;text-align:center;margin-bottom:6px}
.bub{max-width:78%;padding:9px 13px;border-radius:18px;font-size:14.5px;animation:pin .3s}
.bub.him{background:#2c2c2e;color:#fff;align-self:flex-start}
.bub.me{background:#0a84ff;color:#fff;align-self:flex-end}
.typing{align-self:flex-start;background:#2c2c2e;color:#aaa;border-radius:18px;padding:9px 14px;font-size:14px}
@keyframes pin{from{transform:scale(.6);opacity:0}}
/* Lie detector */
canvas.poly{width:100%;height:150px;border:3px solid var(--ink);border-radius:18px;background:#fffdf5;display:block;margin-bottom:12px}
.hold{user-select:none;-webkit-user-select:none;touch-action:none}
.verdict{font-size:30px;font-weight:800;text-align:center;margin:8px 0;letter-spacing:-1px}
/* Rapid */
.timer{height:12px;border:2px solid var(--ink);border-radius:99px;overflow:hidden;margin-bottom:18px}
.timer i{display:block;height:100%;background:var(--lime);width:100%}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.vs .opt{text-align:center;min-height:110px;display:flex;align-items:center;justify-content:center}
.or{text-align:center;font-family:Caveat;font-size:26px;color:var(--pink);margin:6px 0}
/* sign */
canvas.sig{width:100%;height:150px;border:3px dashed var(--ink);border-radius:18px;background:#fff;touch-action:none;display:block}
.contract{font-size:12.5px;line-height:1.55;background:#fff;border:2px solid var(--ink);border-radius:14px;padding:12px 14px;margin-bottom:12px;max-height:170px;overflow:auto}
.contract li{margin-left:16px;margin-bottom:4px}
/* result */
.cert{border:3px double var(--ink);border-radius:18px;padding:20px 16px;text-align:center;background:#fff;position:relative}
.stamp{position:absolute;top:14px;right:10px;transform:rotate(14deg);border:3px solid;border-radius:10px;padding:4px 10px;font-weight:800;font-size:14px;letter-spacing:1px}
.pct{font-size:64px;font-weight:800;letter-spacing:-3px;line-height:1;margin:8px 0 2px;color:var(--pink)}
.pills{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:14px 0}
.pill{border:2px solid var(--ink);border-radius:99px;padding:4px 10px;font-size:11.5px;font-weight:800;background:var(--cream)}
.conf{position:fixed;top:-20px;font-size:22px;animation:fall linear forwards;pointer-events:none;z-index:99}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
.shake{animation:sh .4s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="top"><span class="logo">GF HR DEPT.</span><span class="hearts" id="hearts">❤️❤️❤️</span></div>
  <div class="bar"><i id="bar"></i></div>
  <div id="stage"></div>
  <div class="toast" id="toast"></div>
</div>

<script>
const $=s=>document.querySelector(s);
const stage=$('#stage');
const S={name:'',pts:{vibes:0,flags:0,swipe:0,texts:0,lie:0,rapid:0},max:{vibes:40,flags:15,swipe:10,texts:15,lie:10,rapid:10},notes:[]};
const rand=a=>a[Math.floor(Math.random()*a.length)];
let step=0;

function toast(msg,title='HR NOTE'){const t=$('#toast');t.innerHTML=`<b>${title}</b>${msg}`;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),2600)}
function shake(){const c=$('#card');c.classList.remove('shake');void c.offsetWidth;c.classList.add('shake')}
function hearts(){const p=Object.values(S.pts).reduce((a,b)=>a+b,0),m=Object.values(S.max).reduce((a,b)=>a+b,0);
  const done=STEPS.slice(0,step).reduce((a,s)=>a+(s.w||0),0)||1;const r=p/done;$('#hearts').textContent=r>.75?'❤️❤️❤️':r>.5?'❤️❤️🖤':r>.25?'❤️🖤🖤':'🖤🖤🖤'}
function next(delay=0){setTimeout(()=>{step++;render()},delay)}

/* ---------- step types ---------- */
function choice(o){return{w:10,run(){
  stage.innerHTML=`<span class="tag ${o.spicy?'spicy':''}">${o.tag}</span><h2>${o.q}</h2><p class="hint">${o.hint}</p>`+
  o.opts.map((x,i)=>`<button class="opt" data-i="${i}">${x[0]}</button>`).join('');
  stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
    stage.querySelectorAll('.opt').forEach(z=>z.onclick=null);b.classList.add('pick');
    const [,pts,note]=o.opts[b.dataset.i];S.pts.vibes+=pts;if(pts<4){shake();S.notes.push(o.flag)}
    toast(note,pts>=8?'✅ HR APPROVES':pts>=4?'🤨 HR IS WATCHING':'🚩 FLAGGED');next(2700)})}}}

const STEPS=[
{run(){stage.innerHTML=`<span class="tag">Now hiring · 1 position</span>
<h1>Edoardo's<br>Girlfriend<br>Application™</h1>
<p class="scribble">he's Italian and he's picky, good luck</p>
<p class="hint" style="margin-top:14px">6 scenarios. 5 mini games. 1 lie detector. 0 do-overs. Your results will be reviewed by Edoardo, his dog, and possibly his mom.</p>
<button class="big" id="go">Start my application 💅</button>
<button class="big alt" id="no">I'm not interested</button>
<p class="fine">By tapping start you agree that "I'm fine" is not a valid answer to anything on this form.</p>`;
$('#go').onclick=()=>next();
const n=$('#no');let c=0;const lines=['Are you sure?','Think about it','Wrong button 🙂','That button is decorative','Ok now you HAVE to apply'];
n.onclick=()=>{n.textContent=lines[Math.min(c,lines.length-1)];n.style.transform=`translate(${(Math.random()-.5)*120}px,${(Math.random()-.3)*40}px) rotate(${(Math.random()-.5)*20}deg)`;if(++c>5)next()}}},

{run(){stage.innerHTML=`<span class="tag">Section 1 · Applicant</span><h2>Legal first name?</h2><p class="hint">Nicknames like "baby girl" will be rejected by the system.</p>
<input class="name" id="nm" placeholder="Type here..." maxlength="20" autocomplete="off"><button class="big" id="ok" disabled>Continue →</button>`;
const i=$('#nm'),b=$('#ok');i.focus();i.oninput=()=>b.disabled=i.value.trim().length<2;
b.onclick=()=>{S.name=i.value.trim();const n=S.name.toLowerCase();
 toast(/^(ashley|brittany|becky|karen|stacy)$/.test(n)?`${S.name}... ok. We've had some ${S.name}s before. Proceed carefully.`:`${S.name}. Pretty name. That's +0 points but he noticed.`);next(2200)}}},

choice({tag:'Scenario 01',q:"It's 2am. Edoardo is still on his laptop running like 4 companies. He said \"5 more minutes\" at 11pm.",hint:'We already know what you did last time.',flag:'2am meltdown',opts:[
 ["Bring him an espresso and go to sleep",10,"He will marry you. Possibly tonight, between two emails."],
 ["Send one \"come to bed\" and leave it",8,"Healthy. He'll show up at 4am saying \"ok I'm done\" (he is not done)."],
 ["Close his laptop for him",2,"He had 3 things deploying. You just ended a startup."],
 ["Complain that he loves work more than me",1,"He doesn't. But now he's working on a reply to that too."]]}),

{w:15,run(){
 const R=["checks his phone 🕵️‍♀️","'we need to talk'","'I'm not like other girls'","likes his friend's pics","'k.' 😐","screenshots to group chat","'do what you want'","hates his dog","talks during F1 quali","'Messi or Ronaldo? who cares'"],
       G=["sends memes 😂","cooks real carbonara 🍝","has hobbies","hypes him up","'you hungry?'","knows what DRS is","laughs at his jokes","loves his dog"];
 stage.innerHTML=`<span class="tag game">Mini game 1 · Red Flag Rush</span><h2>Smash the 🚩 red flags. Don't touch the green ones.</h2>
 <div class="hud"><span id="sc">Score 0</span><span id="tm">⏱ 15</span></div><div class="arena" id="ar"></div><button class="big" id="st">Start 🚩</button>`;
 let score=0,t=15,live=true,items=[];const ar=$('#ar');
 $('#st').onclick=()=>{$('#st').remove();
  const spawn=setInterval(()=>{if(!live)return;const red=Math.random()<.6,el=document.createElement('div');
   el.className='fall '+(red?'r':'g');el.textContent=red?'🚩 '+rand(R):'🟢 '+rand(G);el.style.left=Math.random()*(ar.clientWidth-170)+'px';el.style.top='-30px';ar.appendChild(el);
   const o={el,y:-30,v:1.4+Math.random()*1.6+(15-t)*.12,red};items.push(o);
   el.onpointerdown=()=>{if(!live)return;const p=document.createElement('div');p.className='pop';p.style.left=el.style.left;p.style.top=o.y+'px';
    if(red){score++;p.textContent='+1 💥';p.style.color='#ff2e7e'}else{score=Math.max(0,score-2);p.textContent='-2 that was nice!';p.style.color='#2a2';shake()}
    ar.appendChild(p);setTimeout(()=>p.remove(),700);el.remove();items=items.filter(x=>x!==o);$('#sc').textContent='Score '+score}},520);
  const loop=()=>{items.forEach(o=>{o.y+=o.v;o.el.style.top=o.y+'px';if(o.y>350){o.el.remove();o.gone=true}});items=items.filter(o=>!o.gone);if(live)requestAnimationFrame(loop)};loop();
  const clock=setInterval(()=>{t--;$('#tm').textContent='⏱ '+t;if(t<=0){live=false;clearInterval(clock);clearInterval(spawn);
   S.pts.flags=Math.min(15,score);
   toast(score>=15?`${score} red flags destroyed. You'd survive his exes.`:score>=8?`${score} flags. Decent radar. Some slipped through, like they always do.`:`${score}?? Babe you ARE the red flag.`,'🚩 RESULTS');next(2800)}},1000)}}},

choice({spicy:1,tag:'🌶️ Scenario 02',q:"Friday night, his place. He's exhausted from the week. You...",hint:'No wrong answers. Some very wrong answers.',flag:'made his bad day about her',opts:[
 ["Order food, put on something (a show, or 👀), let him decompress — then make it a night he tells no one about 😏",10,"HR had to step outside for a minute. Approved."],
 ["Massage + his favorite drink without being asked",9,"This is how you get a key to his apartment."],
 ["Ask \"what's wrong\" 14 times",3,"He was fine. Now he is not fine."],
 ["Get mad he's tired and make it about me",0,"The tiredness was contagious. Now he's tired of you."]]}),

{w:10,run(){
 const Q=[["💻","He works 14 hour days and calls it \"a light week\""],["🏎️","Sunday race start at 9am is NOT negotiable"],["⚽","He screams at the TV during Champions League like they can hear him"],["🥵","He wants to cuddle but overheats in 6 minutes"],["🍝","Pineapple on pizza = instant breakup. He means it."],["🐶","His dog sleeps in the bed. The dog was here first."],["📱","He answers \"one quick call\" during dinner. It's never quick."]];
 let i=0,acc=0;
 const draw=()=>{if(i>=Q.length){S.pts.swipe=Math.round(acc/Q.length*10);
   toast(acc>=6?`You accepted ${acc}/7 of his flaws. That's love. Or low standards. Either works.`:acc>=4?`${acc}/7. You'll tolerate him. That's basically marriage.`:`You rejected ${Q.length-acc}/7. Girl he's an Italian workaholic with a dog, what did you expect.`,'💘 FLAW TOLERANCE');next(2800);return}
  stage.innerHTML=`<span class="tag game">Mini game 2 · Deal or Dealbreaker</span><h2>His real flaws. Can you live with it?</h2><p class="hint">Card ${i+1} of ${Q.length}</p>
  <div class="swipe"><div class="sc" id="c"><div class="e">${Q[i][0]}</div><p>${Q[i][1]}</p></div></div>
  <div class="row"><button class="big alt" id="n">❌ Dealbreaker</button><button class="big" id="y">💘 I'll deal</button></div>`;
  const go=(ok)=>{$('#c').classList.add(ok?'outR':'outL');if(ok)acc++;i++;setTimeout(draw,380)};
  $('#y').onclick=()=>go(1);$('#n').onclick=()=>go(0)};draw()}},

{w:15,run(){
 const R=[
  {him:"wyd",opts:[["nothing, wbu 😊",5,"Classic. Clean. Leaves the door open."],["why? 🤨",1,"He was just going to invite you to dinner. Was."],["*sends a 4 paragraph update of my day*",2,"He asked 3 letters. You answered with a novel."],["thinking about you 🙂",5,"Short. Deadly. He's already putting on shoes."]]},
  {him:"my mom wants to meet you",opts:[["omg yes, what does she like? I'll bring something",5,"His mom already likes you more than him."],["is she gonna judge me?",3,"Honest. Slightly nervous. Relatable."],["already? we've been together 2 weeks",2,"Correct observation. Wrong energy."],["does she know about me being better than your ex",1,"His mom would love that. His mom would also never forget it."]]},
  {him:"u up? 🌙",opts:[["depends who's asking 😏",5,"He is asking. Loudly."],["yes, why",3,"Ok HR agent. Loosen up."],["it's 1am go to sleep",1,"He was going to be sweet. Now he's going to sleep."],["*leaves on read for 3 hours then says 'sorry was sleeping'*",4,"Power move. Risky. Respected."]]}];
 let r=0;const phone=[];
 const draw=()=>{if(r>=R.length){toast(S.pts.texts>=13?'Texting game is elite. He screenshots your replies to show his friends.':S.pts.texts>=9?'Solid texter. Occasional HR violations.':'Your texting needs a manager. We will assign one.','📱 TEXT SCORE');next(2600);return}
  const c=R[r];
  stage.innerHTML=`<span class="tag game">Mini game 3 · Reply Game</span><h2>He texted. Pick your reply.</h2>
  <div class="phone" id="ph"><div class="ph-head">him 🖤 · iMessage</div>${phone.join('')}<div class="typing" id="ty">•••</div></div><div id="op"></div>`;
  setTimeout(()=>{$('#ty').outerHTML=`<div class="bub him">${c.him}</div>`;
   $('#op').innerHTML=c.opts.map((o,i)=>`<button class="opt" data-i="${i}">${o[0]}</button>`).join('');
   $('#op').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=c.opts[b.dataset.i];S.pts.texts+=o[1];if(o[1]<3)shake();
    phone.push(`<div class="bub him">${c.him}</div>`,`<div class="bub me">${o[0]}</div>`);$('#op').innerHTML='';
    $('#ph').insertAdjacentHTML('beforeend',`<div class="bub me">${o[0]}</div>`);toast(o[2]);r++;setTimeout(draw,2400)})},900)};draw()}},

choice({spicy:1,tag:'🌶️ Scenario 03',q:"He tells you something he's always wanted to try. In the bedroom. You...",hint:'Maturity test. Breathe.',flag:'told the group chat about the bedroom thing',opts:[
 ["Hear him out, say what I'm into too, and no weird energy either way",10,"Communication AND open-mindedness? HR is filing this under 'rare species'."],
 ["\"Hm. Maybe. Buy me dinner first\" 😌",8,"Negotiator. Respect. Dinner is reasonable."],
 ["Make a face then tell the group chat",2,"The group chat now knows. HE now knows the group chat knows."],
 ["\"Did your EX do that??\"",0,"Somehow made it about the ex. Olympic level."]]}),

{w:10,run(){
 const qs=["I have never gone through a man's phone.","I don't care how many followers his ex has.","I've never made a finsta to stalk someone.","I would be fine if he had a girl best friend."];
 const q=rand(qs);
 stage.innerHTML=`<span class="tag game">Mini game 4 · Lie Detector</span><h2>Place your thumb on the sensor and read this out loud:</h2>
 <p class="scribble" style="font-size:26px;margin:4px 0 14px">"${q}"</p>
 <canvas class="poly" id="cv" width="800" height="300"></canvas><div class="verdict" id="vd">&nbsp;</div>
 <button class="big hold" id="hb">👆 HOLD TO SCAN (3 sec)</button>`;
 const cv=$('#cv'),x=cv.getContext('2d');let pts=[],hold=false,t0=0,done=false,raf;
 const draw=()=>{x.fillStyle='#fffdf5';x.fillRect(0,0,800,300);x.strokeStyle='#eee';for(let g=0;g<800;g+=40){x.beginPath();x.moveTo(g,0);x.lineTo(g,300);x.stroke()}
  const el=hold?(Date.now()-t0)/3000:0,amp=hold?20+el*120:4;pts.push(150+(Math.random()-.5)*amp*2);if(pts.length>160)pts.shift();
  x.strokeStyle='#ff2e7e';x.lineWidth=4;x.beginPath();pts.forEach((p,i)=>i?x.lineTo(i*5,p):x.moveTo(0,p));x.stroke();
  if(hold&&!done){$('#hb').textContent=`Scanning... ${Math.min(100,Math.round(el*100))}%`;if(el>=1)finish()}
  if(!done||pts.length<160)raf=requestAnimationFrame(draw)};draw();
 const finish=()=>{done=true;hold=false;const lie=Math.random()<.85;const v=$('#vd');
  v.textContent=lie?'🚨 LIE DETECTED 🚨':'✅ TRUTH (somehow)';v.style.color=lie?'#ff3b30':'#1a1';if(lie)shake();
  S.pts.lie=lie?6:10;$('#hb').textContent=lie?'The machine is never wrong':'The machine is shocked too';$('#hb').disabled=true;
  toast(lie?"It's ok. Everyone lies on this one. We gave you partial credit for bravery.":"Either you're a saint or you've beaten a polygraph before. Both are hot.",'🔬 SCAN COMPLETE');setTimeout(()=>{cancelAnimationFrame(raf);next()},3000)};
 const hb=$('#hb');
 hb.onpointerdown=e=>{if(done)return;e.preventDefault();hold=true;t0=Date.now()};
 const up=()=>{if(hold&&!done){hold=false;hb.textContent='You let go 😭 sus. Hold again';shake()}};hb.onpointerup=up;hb.onpointerleave=up;hb.oncontextmenu=e=>e.preventDefault()}},

{w:10,run(){
 const Q=[["Watch F1 with him at 9am Sunday","Sleep in alone"],["He's always free","He's building something big and busy"],["Olive Garden","His nonna's recipe"],["Ferrari fan","Red Bull fan"],["He's your best friend","He's your \"situationship\""]],good=[0,1,1,-1,0];
 let i=0,s=0,iv;
 const draw=()=>{clearInterval(iv);if(i>=Q.length){S.pts.rapid=Math.min(10,s*2.5);
   toast(s>=4?'Speed AND sanity. You were built for this.':s>=2?'Mixed results. The timer exposed a few things.':'The pressure revealed your true self. We saw it. We cannot unsee it.','⚡ RAPID FIRE');next(2600);return}
  stage.innerHTML=`<span class="tag game">Mini game 5 · Rapid Fire</span><h2>Would you rather...</h2><p class="hint">${i+1}/5 · 4 seconds · no thinking allowed</p>
  <div class="timer"><i id="ti"></i></div><div class="vs"><button class="opt" data-k="0">${Q[i][0]}</button><button class="opt" data-k="1">${Q[i][1]}</button></div><p class="or">choose. NOW.</p>`;
  let left=400;iv=setInterval(()=>{left--;$('#ti').style.width=left/4+'%';$('#ti').style.background=left<120?'#ff3b30':'';if(left<=0){clearInterval(iv);toast('Too slow. Verstappen would have lapped you.','⏰ TIME');i++;setTimeout(draw,900)}},10);
  stage.querySelectorAll('.vs .opt').forEach(b=>b.onclick=()=>{clearInterval(iv);b.classList.add('pick');const k=+b.dataset.k;
   if(good[i]===-1||good[i]===k)s++;else if(k===0&&i!==4){shake()}i++;setTimeout(draw,500)})};draw()}},

choice({tag:'Scenario 04',q:"Edoardo just closed a big deal / launched something new. First thing you do?",hint:'How you show up for his wins says everything.',flag:'got weird about his success',opts:[
 ["Scream, hug him, open the good wine",10,"Main character's girlfriend behavior. Approved."],
 ["Take him to dinner and ban his phone for 2 hours",9,"Classy. Warm. He's calling his mom about you."],
 ["\"Congrats! so... about that bag I wanted\"",3,"The pivot was so fast he got whiplash."],
 ["Get quiet and weird about it",0,"Felt threatened by a man's Stripe dashboard. Flagged."]]}),

choice({tag:'Final question',q:"Real talk. What do you actually bring to the table?",hint:'This one decides everything.',flag:'brings a table but no food',opts:[
 ["Consistency, loyalty, and I make his life better",10,"That's the whole job description. Word for word."],
 ["Fun, zero drama, and I'm hot. Next question.",9,"Confidence noted. Committee nodded aggressively."],
 ["I'm a work in progress 🥲",6,"Honest. Growth mindset. We respect it."],
 ["I don't bring anything, I AM the table",2,"...HR needs a minute."]]}),

{run(){
 stage.innerHTML=`<span class="tag">Section 9 · Binding agreement</span><h2>Sign the girlfriend contract.</h2>
 <div class="contract"><b>Terms & Conditions</b><ol style="margin-top:6px">
 <li>Applicant agrees "I'm fine" means she is fine.</li><li>Restaurant must be selected within 90 seconds of "where do you wanna eat".</li>
 <li>Hoodies borrowed become her property. This is non-negotiable (for him).</li><li>Race weekends and Champions League nights are sacred. Emotional discussions available during safety cars and halftime only.</li><li>The dog outranks her in the first 6 months. After that it's a tie.</li><li>"Just 5 more minutes" at the laptop means 45. She accepts this.</li>
 <li>No cutting spaghetti. No ketchup on pasta. Ever.</li><li>Fighting over text is prohibited. Call like the ancestors.</li>
 <li>Good morning texts are mandatory. Bad morning texts also accepted.</li><li>This contract auto-renews unless someone forgets an anniversary.</li></ol></div>
 <canvas class="sig" id="sg" width="800" height="300"></canvas><p class="fine" style="margin-top:6px">✍️ Sign above with your finger</p>
 <button class="big" id="sb" disabled>Submit application 💌</button>`;
 const c=$('#sg'),x=c.getContext('2d');let d=false,len=0;x.lineWidth=6;x.lineCap='round';x.strokeStyle='#111';
 const p=e=>{const r=c.getBoundingClientRect();return[(e.clientX-r.left)*800/r.width,(e.clientY-r.top)*300/r.height]};
 c.onpointerdown=e=>{d=true;c.setPointerCapture(e.pointerId);x.beginPath();x.moveTo(...p(e))};
 c.onpointermove=e=>{if(!d)return;x.lineTo(...p(e));x.stroke();if(++len>25)$('#sb').disabled=false};c.onpointerup=()=>d=false;
 $('#sb').onclick=()=>{stage.innerHTML=`<div style="text-align:center;padding-top:120px"><div style="font-size:60px">🧑‍⚖️</div><h2 id="rv">Committee reviewing...</h2><p class="hint" id="rs">Consulting his group chat</p></div>`;
  const msgs=['Asking his dog','Checking with his Italian mom','Zooming into your Instagram','Checking if you know who Leclerc is','Final vote...'];let k=0;
  const iv=setInterval(()=>{$('#rs').textContent=msgs[k++];if(k>msgs.length){clearInterval(iv);next()}},700)}}},

{run(){
 const got=Object.values(S.pts).reduce((a,b)=>a+b,0),max=Object.values(S.max).reduce((a,b)=>a+b,0);
 const pct=Math.max(3,Math.min(100,Math.round(got/max*100)));
 const tier=pct>=82?{s:'HIRED',c:'#1a1',e:'💍',t:'Application APPROVED',v:`Congratulations ${S.name}. You passed the scenarios, survived the lie detector, and texted like a professional. The committee voted unanimously (1–0). Report to your first date immediately. He's picking the Italian place, don't argue.`}
  :pct>=65?{s:'SHORTLIST',c:'#e6a100',e:'😏',t:'Strong candidate',v:`${S.name}, you're close. Really close. A few answers made HR raise one eyebrow, but the other eyebrow is still in your favor. Final round: in-person interview. Dress code: whatever makes him close his laptop.`}
  :pct>=45?{s:'WAITLIST',c:'#ff7a00',e:'📋',t:'Waitlisted',v:`${S.name}, there's potential here, buried under a few things we will not be discussing publicly. You're #3 on the waitlist. Positions open up often. He is usually busy working.`}
  :{s:'REJECTED',c:'#ff3b30',e:'💀',t:'Application received...',v:`${S.name}, thank you for applying. Your file has been placed in a very special folder. The folder is on fire. But honestly? You were fun to review and the committee laughed a lot.`};
 const flags=S.notes.length?`<p class="fine" style="color:#ff3b30;margin-top:10px">🚩 Flagged: ${S.notes.join(' · ')}</p>`:`<p class="fine" style="color:#1a1;margin-top:10px">🟢 Zero flags. Suspicious. We'll keep watching.</p>`;
 stage.innerHTML=`<div class="cert"><div class="stamp" style="color:${tier.c};border-color:${tier.c}">${tier.s}</div>
 <div style="font-size:46px">${tier.e}</div><p class="fine" style="margin:4px 0 0">OFFICIAL GIRLFRIEND ASSESSMENT</p>
 <h2 style="margin-top:6px">${S.name}</h2><div class="pct">${pct}%</div><p style="font-weight:800">girlfriend material</p>
 <div class="pills"><span class="pill">🧠 Vibes ${S.pts.vibes}/40</span><span class="pill">🚩 Flags ${S.pts.flags}/15</span><span class="pill">💘 Tolerance ${S.pts.swipe}/10</span><span class="pill">📱 Texting ${S.pts.texts}/15</span><span class="pill">🔬 Honesty ${S.pts.lie}/10</span><span class="pill">⚡ Speed ${Math.round(S.pts.rapid)}/10</span></div>
 <p style="font-size:14px;line-height:1.5;text-align:left">${tier.v}</p>${flags}</div>
 <button class="big" id="sh">📸 Send my results to him</button><button class="big alt" id="rt">Reapply (we won't tell)</button>`;
 $('#bar').style.width='100%';
 if(pct>=65)for(let i=0;i<60;i++){const e=document.createElement('div');e.className='conf';e.textContent=rand(['💖','💍','✨','🎉','💅','🌹']);e.style.left=Math.random()*100+'vw';e.style.animationDuration=2+Math.random()*3+'s';e.style.animationDelay=Math.random()*1.5+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),6000)}
 $('#sh').onclick=async()=>{const txt=`I just scored ${pct}% on Edoardo's Girlfriend Application™ (${tier.s}) 😤 ${location.href}`;
  if(navigator.share){try{await navigator.share({text:txt})}catch(e){}}else{navigator.clipboard.writeText(txt);toast('Copied. Paste it in his DMs. Confidently.','📋 COPIED')}};
 $('#rt').onclick=()=>location.reload()}}];

function render(){$('#bar').style.width=(step/(STEPS.length-1)*100)+'%';hearts();STEPS[step].run()}
render();
</script>
